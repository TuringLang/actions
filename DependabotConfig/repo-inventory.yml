# Editable inventory for the Dependabot configuration rollout.
# Start small, verify the generated PRs, then add more TuringLang repositories.
defaults:
  remove_compathelper: true
  update_dependabot: true
  dependabot:
    github_actions:
      enabled: true
      interval: weekly
    julia:
      enabled: true
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Kolkata"
      group_all: true
    npm:
      enabled: false
      interval: weekly
      group_all: true
    cargo:
      enabled: false
      interval: weekly
      group_all: true

repositories:
  - name: NormalizingFlows.jl
    julia_directories:
      - "/"

  - name: AdvancedMH.jl
    julia_directories:
      - "/"

  - name: JuliaBUGS.jl
    julia_directories:
      - "/JuliaBUGS"
    npm_directories:
      - "/DoodleBUGS"
    dependabot:
      npm:
        enabled: true
