name: 'DependabotConfig'
author: 'TuringLang'
description: 'Migrate TuringLang repositories from CompatHelper to Dependabot configuration'

inputs:
  target:
    description: 'Target repo: inventory or a single repo name'
    default: 'inventory'
  remove-compathelper:
    description: 'Remove CompatHelper workflow if present'
    default: 'true'
  update-dependabot:
    description: 'Create or update Dependabot config'
    default: 'true'
  branch-name:
    description: 'Branch name to create/update in target repos'
    default: 'dependabot-config'
  dry-run:
    description: 'Print planned changes only'
    default: 'true'
  inventory-path:
    description: 'Path to the Dependabot repo inventory YAML file'
    default: 'DependabotConfig/repo-inventory.yml'

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install generator dependencies
      shell: bash
      run: npm ci --prefix DependabotConfig

    - name: Run Dependabot configuration update
      shell: bash
      run: DependabotConfig/dependabot-config.sh
      env:
        TARGET: ${{ inputs.target }}
        REMOVE_COMPATHELPER: ${{ inputs.remove-compathelper }}
        UPDATE_DEPENDABOT: ${{ inputs.update-dependabot }}
        BRANCH: ${{ inputs.branch-name }}
        DRY_RUN: ${{ inputs.dry-run }}
        INVENTORY_PATH: ${{ inputs.inventory-path }}
