name: Sync PR Summary
description: Consolidate workflow outputs and bot comments into a single managed bot comment on the PR.

inputs:
  docs-content:
    description: Documentation preview content to inject into the managed bot comment.
    required: false
    default: ''
  perf-content:
    description: Performance summary content to inject into the managed bot comment.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        INPUT_DOCS_CONTENT: ${{ inputs.docs-content }}
        INPUT_PERF_CONTENT: ${{ inputs.perf-content }}
      with:
        github-token: ${{ github.token }}
        script: |
          const START_MARKER = "<!-- managed-pr-summary:start -->";
          const END_MARKER   = "<!-- managed-pr-summary:end -->";

          const SECTIONS = [
            {
              key:      "docs",
              title:    "Documentation Preview",
              input:    (process.env.INPUT_DOCS_CONTENT ?? "").trim(),
              fallback: "_Pending. No docs preview available yet._",
            },
            {
              key:      "perf",
              marker:   "<!-- perf-results -->",
              title:    "Performance",
              input:    (process.env.INPUT_PERF_CONTENT ?? "").trim(),
              fallback: "_Pending. No performance results available yet._",
            },
          ];

          function readSection(body, key) {
            const open  = `<!-- section:${key} -->`;
            const close = `<!-- /section:${key} -->`;
            const s = body.indexOf(open);
            const e = body.indexOf(close);
            if (s === -1 || e === -1 || e <= s) return null;
            return body.slice(s + open.length, e).trim();
          }

          function buildBody(resolvedSections) {
            const inner = resolvedSections
              .map(({ key, title, content }) =>
                `<!-- section:${key} -->\n### ${title}\n\n${content}\n<!-- /section:${key} -->`)
              .join("\n\n");
            return `${START_MARKER}\n## CI Summary — GitHub Actions\n\n${inner}\n${END_MARKER}`;
          }

          const { owner, repo } = context.repo;
          const prNumber = context.payload.pull_request.number;

          const allComments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number: prNumber, per_page: 100,
          });

          const managedComment = allComments.find((c) => {
            const user = c.user?.login;
            const app  = c.performed_via_github_app?.slug;
            const isBot = user === "github-actions[bot]" || app === "github-actions";
            return isBot && (c.body || "").includes(START_MARKER);
          });

          const managedBody = managedComment?.body ?? "";

          const latestByMarker = new Map();
          for (const comment of allComments) {
            const body = comment.body || "";
            const user = comment.user?.login;
            const app  = comment.performed_via_github_app?.slug;
            const isBot = user === "github-actions[bot]" || app === "github-actions";
            if (!isBot) continue;

            for (const { marker, title } of SECTIONS) {
              if (!marker) continue;
              if (!body.startsWith(marker)) continue;
              const content = body.slice(marker.length).trim();
              if (content) latestByMarker.set(marker, content);
            }
          }

          const resolvedSections = SECTIONS.map(({ key, marker, title, input, fallback }) => ({
            key,
            title,
            content: input || latestByMarker.get(marker) || readSection(managedBody, key) || fallback,
          }));

          const newBody = buildBody(resolvedSections);

          if (managedComment) {
            if (managedComment.body !== newBody) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: managedComment.id, body: newBody });
            } else {
              core.info("PR summary already up to date.");
            }
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: newBody });
          }
